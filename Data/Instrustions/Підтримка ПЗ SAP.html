ithSpacing\\\\\\"\\u003e&nbsp;\\u003c/p\\u003e\\u003cp\\u003eОбов’язково необхідно:\\u003c/p\\u003e\\u003cul class=\\\\\\"customListStyle\\\\\\"\\u003e\\u003cli class=\\\\\\"fontSizeLarge\\\\\\" style=\\\\\\"font-size:18px;\\\\\\" data-list-item-id=\\\\\\"eb851e95b35597a584a2adc46d5e5de1a\\\\\\"\\u003eобрати систему SAP зі списку;\\u003c/li\\u003e\\u003cli class=\\\\\\"fontSizeLarge\\\\\\" style=\\\\\\"font-size:18px;\\\\\\" data-list-item-id=\\\\\\"e97587aea54e231278a4d6847e39af387\\\\\\"\\u003eобрати транзакцію;\\u003c/li\\u003e\\u003cli class=\\\\\\"fontSizeLarge\\\\\\" style=\\\\\\"font-size:18px;\\\\\\" data-list-item-id=\\\\\\"e0595887c07741c49f06a74ae49c7cf8f\\\\\\"\\u003e\\u003cp\\u003eдодати скріншот екрану вибору та скріншот помилки.\\u003c/p\\u003e\\u003cp class=\\\\\\"noSpacingAbove spacingBelow\\\\\\" data-text-type=\\\\\\"withSpacing\\\\\\"\\u003e&nbsp;\\u003c/p\\u003e\\u003c/li\\u003e\\u003c/ul\\u003e\\u003cp\\u003eБез зазначення системи або транзакції звернення не може бути опрацьоване коректно.\\u003c/p\\u003e\\u003cp\\u003eВкладення скріншоту є обов’язковим полем.\\u003c/p\\u003e\\u003cp class=\\\\\\"noSpacingAbove noSpacingBelow\\\\\\" aria-hidden=\\\\\\"true\\\\\\" data-text-type=\\\\\\"noSpacing\\\\\\"\\u003e&nbsp;\\u003c/p\\u003e\\"},{\\"position\\":{\\"layoutIndex\\":1,\\"zoneIndex\\":2,\\"zoneId\\":\\"27418be5-0c40-4173-bdc3-f33a48baa266\\",\\"sectionIndex\\":1,\\"sectionFactor\\":12,\\"controlIndex\\":5},\\"id\\":\\"b4622e1b-2174-45ca-8bf4-4b354bb47fe7\\",\\"controlType\\":4,\\"isFromSectionTemplate\\":false,\\"addedFromPersistedData\\":true,\\"contentVersion\\":5,\\"innerHTML\\":\\"\\u003ch2 class=\\\\\\"headingSpacingAbove headingSpacingBelow\\\\\\" style=\\\\\\"text-align:center;\\\\\\"\\u003eЧасті питання\\u003c/h2\\u003e\\u003cp\\u003e\\u003cstrong\\u003e1. У яких випадках потрібно створювати звернення «Підтримка ПЗ SAP»?\\u003c/strong\\u003e\\u003c/p\\u003e\\u003cp\\u003eЯкщо виникла помилка в SAP або некоректно працює транзакція.\\u003c/p\\u003e\\u003cp class=\\\\\\"noSpacingAbove spacingBelow\\\\\\" aria-hidden=\\\\\\"true\\\\\\" data-text-type=\\\\\\"withSpacing\\\\\\"\\u003e&nbsp;\\u003c/p\\u003e\\u003cp\\u003e\\u003cstrong\\u003e2. Які системи SAP доступні у шаблоні?\\u003c/strong\\u003e\\u003c/p\\u003e\\u003cp\\u003eУ випадаючому списку доступні:\\u003c/p\\u003e\\u003cp\\u003eBAP (Analyzer)\\u003c/p\\u003e\\u003cp\\u003eFOP (Fiori)\\u003c/p\\u003e\\u003cp\\u003eRPA\\u003c/p\\u003e\\u003cp\\u003eS2P\\u003c/p\\u003e\\u003cp class=\\\\\\"noSpacingAbove spacingBelow\\\\\\" aria-hidden=\\\\\\"true\\\\\\" data-text-type=\\\\\\"withSpacing\\\\\\"\\u003e&nbsp;\\u003c/p\\u003e\\u003cp\\u003e\\u003cstrong\\u003e3. Чи обов’язково обирати транзакцію?\\u003c/strong\\u003e\\u003c/p\\u003e\\u003cp\\u003eТак. Після вибору системи потрібно обрати конкретну транзакцію зі списку.\\u003cbr\\u003eБез цього запит не зможе бути коректно маршрутизований.\\u003c/p\\u003e\\u003cp class=\\\\\\"noSpacingAbove spacingBelow\\\\\\" aria-hidden=\\\\\\"true\\\\\\" data-text-type=\\\\\\"withSpacing\\\\\\"\\u003e&nbsp;\\u003c/p\\u003e\\u003cp\\u003e\\u003cstrong\\u003e4. Чи обов’язково додавати скріншоти?\\u003c/strong\\u003e\\u003c/p\\u003e\\u003cp\\u003eТак. Необхідно додати:\\u003c/p\\u003e\\u003cul class=\\\\\\"customListStyle\\\\\\"\\u003e\\u003cli class=\\\\\\"fontSizeLarge\\\\\\" style=\\\\\\"font-size:18px;\\\\\\" data-list-item-id=\\\\\\"eb4f5c677ea33fcad53cb2373ff75e010\\\\\\"\\u003eскріншот екрану вибору;\\u003c/li\\u003e\\u003cli class=\\\\\\"fontSizeLarge\\\\\\" style=\\\\\\"font-size:18px;\\\\\\" data-list-item-id=\\\\\\"e34e381ed377279663c39e84cb60eac95\\\\\\"\\u003eскріншот помилки (якщо вона є).\\u003c/li\\u003e\\u003c/ul\\u003e\\u003cp aria-hidden=\\\\\\"true\\\\\\"\\u003e&nbsp;\\u003c/p\\u003e\\"},{\\"position\\":{\\"layoutIndex\\":1,\\"zoneIndex\\":2,\\"zoneId\\":\\"27418be5-0c40-4173-bdc3-f33a48baa266\\",\\"sectionIndex\\":1,\\"sectionFactor\\":12,\\"controlIndex\\":6},\\"id\\":\\"ceb5f189-8d72-4895-a35c-5417ad2f0e5e\\",\\"controlType\\":4,\\"isFromSectionTemplate\\":false,\\"addedFromPersistedData\\":true,\\"contentVersion\\":5,\\"innerHTML\\":\\"\\u003ch2 class=\\\\\\"headingSpacingAbove headingSpacingBelow\\\\\\" style=\\\\\\"margin-left:0px;text-align:center;\\\\\\"\\u003eРеєстрація звернення Підтримка ПЗ SAP &nbsp;\\u003c/h2\\u003e\\u003cp class=\\\\\\"noSpacingAbove spacingBelow\\\\\\" style=\\\\\\"margin-left:0px;\\\\\\" data-text-type=\\\\\\"withSpacing\\\\\\"\\u003e\\u003cstrong\\u003eДе знайти шаблон звернення “Підтримка ПЗ SAP”?\\u003c/strong\\u003e\\u003c/p\\u003e\\u003cul class=\\\\\\"customListStyle\\\\\\"\\u003e\\u003cli data-list-item-id=\\\\\\"e5bc502be242085bf6edb85770ad1cdae\\\\\\"\\u003e\\u003cp class=\\\\\\"noSpacingAbove spacingBelow\\\\\\" data-text-type=\\\\\\"withSpacing\\\\\\"\\u003eШлях до звернення на ресурсі \\u003ca href=\\\\\\"https://servicedesk.fozzy.lan/\\\\\\"\\u003ehttps://servicedesk.fozzy.lan/\\u003c/a\\u003e → Операційна діяльність →&nbsp;Підтримка модулів, програмне забезпечення →&nbsp;Підтримка ПЗ SAP. Або за посиланням внизу сторінки.&nbsp;\\u003c/p\\u003e\\u003cp class=\\\\\\"noSpacingAbove spacingBelow\\\\\\" data-text-type=\\\\\\"withSpacing\\\\\\"\\u003e\\u003cstrong\\u003eДля реєстрації запиту, необхідно в шаблоні звернення:\\u003c/strong\\u003e\\u003c/p\\u003e\\u003c/li\\u003e\\u003cli data-list-item-id=\\\\\\"ea0c61c9ae04bc876666a83043541a81a\\\\\\"\\u003e\\u003cp class=\\\\\\"noSpacingAbove spacingBelow\\\\\\" style=\\\\\\"margin-left:0px;\\\\\\" data-text-type=\\\\\\"withSpacing\\\\\\"\\u003eВ полі “Запитується для” вписати або через “+” обрати з переліку ПІБ колеги, якщо створюєте звернення не для себе. Якщо звернення стосується лише Вас, тоді лишаєте поле без змін.\\u003c/p\\u003e\\u003c/li\\u003e\\u003cli data-list-item-id=\\\\\\"e22259d1faca124d8b00e7d01ce2ca8bd\\\\\\"\\u003e\\u003cp class=\\\\\\"noSpacingAbove noSpacingBelow\\\\\\" style=\\\\\\"margin-left:0px;\\\\\\" data-text-type=\\\\\\"noSpacing\\\\\\"\\u003eВ полі SAP Login вказати свій логін.\\u003c/p\\u003e\\u003c/li\\u003e\\u003cli data-list-item-id=\\\\\\"ea6bdb84ccba8f28a12d4426970aec876\\\\\\"\\u003e\\u003cp\\u003eУ полі Система SAP обрати одну з доступних систем:\\u003c/p\\u003e\\u003cp\\u003eBAP (Analyzer)\\u003c/p\\u003e\\u003cp\\u003eFOP (Fiori)\\u003c/p\\u003e\\u003cp\\u003eRPA\\u003c/p\\u003e\\u003cp\\u003eS2P\\u003c/p\\u003e\\u003c/li\\u003e\\u003cli data-list-item-id=\\\\\\"e880734490c702dce12b09972cce3ba78\\\\\\"\\u003eПісля вибору системи - обрати Транзакцію та її назву.\\u003c/li\\u003e\\u003cli data-list-item-id=\\\\\\"e3438f263a19499b8f9731a8a935042a8\\\\\\"\\u003e\\u003cp\\u003eДодати:\\u003c/p\\u003e\\u003cp\\u003eскріншот екрану вибору;\\u003c/p\\u003e\\u003cp\\u003eскріншот помилки.\\u003c/p\\u003e\\u003c/li\\u003e\\u003cli data-list-item-id=\\\\\\"e961f41c7aeaca89a82dc2cf59e1ef613\\\\\\"\\u003eЗа необхідності внести додаткову інформацію у поле Повний опис.\\u003c/li\\u003e\\u003cli data-list-item-id=\\\\\\"e4e6d0904c2219af404594a44ef6fd21e\\\\\\"\\u003e\\u003cp class=\\\\\\"noSpacingAbove spacingBelow\\\\\\" style=\\\\\\"margin-left:0px;\\\\\\" data-text-type=\\\\\\"withSpacing\\\\\\"\\u003eНатисніть “Підтвердити” - і звернення зареєстровано. Чекайте на зворотній зв\'язок від ServiceDesk.\\u003c/p\\u003e\\u003c/li\\u003e\\u003c/ul\\u003e\\"},{\\"position\\":{\\"layoutIndex\\":1,\\"zoneIndex\\":2,\\"zoneId\\":\\"27418be5-0c40-4173-bdc3-f33a48baa266\\",\\"sectionIndex\\":1,\\"sectionFactor\\":12,\\"controlIndex\\":7},\\"id\\":\\"23537c9d-28fa-4443-b58f-25488066067d\\",\\"controlType\\":3,\\"isFromSectionTemplate\\":false,\\"addedFromPersistedData\\":true,\\"webPartId\\":\\"0f087d7f-520e-42b7-89c0-496aaf979d58\\",\\"reservedWidth\\":1188,\\"reservedHeight\\":40,\\"webPartData\\":{\\"id\\":\\"0f087d7f-520e-42b7-89c0-496aaf979d58\\",\\"instanceId\\":\\"23537c9d-28fa-4443-b58f-25488066067d\\",\\"title\\":\\"Кнопка\\",\\"description\\":\\"Додавання інтерактивної кнопки з настроюваним підписом і поси
